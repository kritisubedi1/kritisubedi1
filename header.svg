<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1512"/>
      <stop offset="100%" stop-color="#0F0D0B"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B46B" stop-opacity="0"/>
      <stop offset="15%" stop-color="#E8B46B" stop-opacity="0.55"/>
      <stop offset="85%" stop-color="#E8B46B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8B46B" stop-opacity="0"/>
    </linearGradient>
    <style>
      .name { font: 700 58px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F5EFE6; letter-spacing: -1px; }
      .role { font: 400 24px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #E9DFD0; }
      .tag  { font: 600 15px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #E8B46B; letter-spacing: 1.5px; }
      .lbl  { font: 700 12px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #E8B46B; letter-spacing: 2.5px; }
      .big  { font: 700 26px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F5EFE6; }
      .sm   { font: 700 11px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #A89C8C; letter-spacing: 2px; }
      .foot { font: 400 12px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #7D7366; }
      .trace { stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: draw 4s ease-out forwards; }
      .dot { animation: blink 1.6s ease-in-out infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#bg)" stroke="#2C251F" stroke-width="2"/>

  <!-- subtle grid -->
  <g stroke="#E8B46B" stroke-opacity="0.04">
    <path d="M0 80H1200M0 160H1200M0 240H1200"/>
    <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>

  <!-- Left: identity -->
  <text x="64" y="112" class="name">Kriti Subedi</text>
  <rect x="66" y="130" width="54" height="3" rx="1.5" fill="#E8B46B"/>
  <text x="64" y="172" class="role">Software Engineer · Java &amp; Spring Boot</text>
  <text x="64" y="206" class="tag">BACKEND · FULL STACK · AI-ENABLED APPLICATIONS</text>

  <!-- Divider -->
  <line x1="770" y1="56" x2="770" y2="214" stroke="#3A3129" stroke-width="1.5"/>

  <!-- Right: focus column -->
  <text x="806" y="74" class="lbl">CURRENT FOCUS</text>
  <text x="806" y="118" class="big">Java</text>
  <text x="806" y="138" class="sm">SPRING BOOT</text>
  <text x="926" y="118" class="big">Web</text>
  <text x="926" y="138" class="sm">FULL STACK</text>
  <text x="1046" y="118" class="big">AI</text>
  <text x="1046" y="138" class="sm">LLM · NLP</text>
  <circle cx="812" cy="196" r="5" fill="#5BD08B" class="dot"/>
  <text x="826" y="200" class="foot">MASc Software Engineering · MUN · NL, Canada</text>

  <!-- Bottom: signal trace (request → service → response) -->
  <path class="trace" fill="none" stroke="url(#fade)" stroke-width="2" stroke-linejoin="round"
        d="M20 268 H150 L165 268 L175 248 L185 288 L195 268 H330 L345 268 L355 244 L365 268 H480
           L492 268 L500 252 L508 284 L516 268 H660 L672 268 L682 246 L692 290 L702 268 H840
           L852 268 L862 250 L872 268 H990 L1002 268 L1010 252 L1018 284 L1026 268 H1180"/>
  <text x="1136" y="306" class="foot" text-anchor="end">@kritisubedi1</text>
</svg>
